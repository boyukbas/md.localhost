<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recently opened{{.TitleSuffix}}</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="theme-color" content="#2b7fff">
<script>
(function(){try{var t=localStorage.getItem("mdl.theme")||"auto";var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d){document.documentElement.classList.add("theme-dark");}document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/assets/style.css?v={{.Version}}">
</head>
<body class="{{if .Tabs}}with-tabs{{end}}" data-events-url="/events">
<header class="topbar">
  <div class="topbar-left">
    <div class="crumbs">
      <span class="filename">md.localhost</span>
      <span class="dir">&lrm;{{.Origin}}</span>
    </div>
  </div>
  <div class="topbar-right">
    <button class="iconbtn" id="theme-toggle" type="button" title="Light / dark / auto" aria-label="Switch theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="i-sun"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 .8v2.1M8 13.1v2.1M.8 8h2.1M13.1 8h2.1M2.9 2.9l1.5 1.5M11.6 11.6l1.5 1.5M13.1 2.9l-1.5 1.5M4.4 11.6l-1.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="i-moon"><path d="M13.4 9.9A5.8 5.8 0 0 1 6.1 2.6a5.9 5.9 0 1 0 7.3 7.3z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<nav class="tabstrip" id="tabs" aria-label="Open documents">
  {{range .Tabs}}
  <a class="tab{{if .Active}} active{{end}}" href="{{.URL}}" data-path="{{.Path}}" title="{{.Path}}">
    <span class="tab-name">{{.Name}}</span>
    <span class="tab-close" role="button" aria-label="Close {{.Name}}">&times;</span>
  </a>
  {{end}}
</nav>

<div class="layout">
  <main class="content">
    <article class="markdown-body">
      <h1>Recently opened</h1>
      {{if .Recent}}
      <ul class="recent">
        {{range .Recent}}
        <li{{if .Missing}} class="missing"{{end}}>
          <a href="{{.URL}}">{{.Name}}</a>
          <span class="dir">&lrm;{{.Dir}}</span>
          {{if .Missing}}<span class="badge">missing</span>{{end}}
        </li>
        {{end}}
      </ul>
      {{else}}
      <p>Nothing yet. Double-click a <code>.md</code> file in Explorer and it will show up here.</p>
      {{end}}
    </article>
    <footer class="pagefoot"><span>md.localhost {{.Version}}</span></footer>
  </main>
</div>
<script src="/assets/app.js?v={{.Version}}"></script>
</body>
</html>
