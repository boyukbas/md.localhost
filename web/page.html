<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>{{.Title}}{{.TitleSuffix}}</title>
<link rel="icon" href="/favicon.ico">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<meta name="theme-color" content="#2b7fff">
<script>
(function(){try{var r=document.documentElement;var t=localStorage.getItem("mdl.theme")||"auto";var d=t==="dark"||(t==="auto"&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(d){r.classList.add("theme-dark");}r.setAttribute("data-theme",t);if(localStorage.getItem("mdl.wrap")==="off"){r.classList.add("mdl-nowrap");}if(localStorage.getItem("mdl.jira")==="off"){r.classList.add("mdl-jira-raw");}}catch(e){}})();
</script>
<link rel="stylesheet" href="/assets/style.css?v={{.Version}}">
</head>
<body class="{{if .Tabs}}with-tabs{{end}}" data-events-url="{{.EventsURL}}" data-doc-key="{{.FullPath}}" data-doc-path="{{.FullPath}}">
<header class="topbar">
  <div class="topbar-left">
    <a class="home" href="/" title="Recently opened files" aria-label="Recently opened files">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5 1.5 7h1.75v6.5h3.25V9.75h3v3.75h3.25V7H15.5z" fill="currentColor"/></svg>
    </a>
    <div class="crumbs">
      <span class="filename">{{.FileName}}</span>
      <span class="dir" title="{{.FullPath}}">&lrm;{{.Dir}}</span>
    </div>
  </div>
  <div class="topbar-right">
    {{if .Modified}}<span class="meta" id="modified">modified {{.Modified}}</span>{{end}}
    <span class="badge" id="reload-badge" hidden>updated</span>
    <button class="iconbtn" id="toc-toggle" type="button" title="Toggle contents" aria-label="Toggle contents">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v1.6H2zM2 7.2h12v1.6H2zM2 11.4h8V13H2z" fill="currentColor"/></svg>
    </button>
    <button class="iconbtn" id="theme-toggle" type="button" title="Light / dark / auto" aria-label="Switch theme">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="i-sun"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path d="M8 .8v2.1M8 13.1v2.1M.8 8h2.1M13.1 8h2.1M2.9 2.9l1.5 1.5M11.6 11.6l1.5 1.5M13.1 2.9l-1.5 1.5M4.4 11.6l-1.5 1.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" class="i-moon"><path d="M13.4 9.9A5.8 5.8 0 0 1 6.1 2.6a5.9 5.9 0 1 0 7.3 7.3z" fill="currentColor"/></svg>
    </button>
    <button class="iconbtn" id="print-btn" type="button" title="Print or save as PDF" aria-label="Print">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h8V5H4zM2 6h12v5h-2.5v3.5h-7V11H2zm3.5 5h5v2h-5z" fill="currentColor"/></svg>
    </button>
  </div>
</header>

<nav class="tabstrip" id="tabs" aria-label="Open documents">
  {{range .Tabs}}
  <a class="tab{{if .Active}} active{{end}}" href="{{.URL}}" data-path="{{.Path}}" title="{{.Path}}">
    <span class="tab-name">{{.Name}}</span>
    <span class="tab-close" role="button" aria-label="Close {{.Name}}">&times;</span>
  </a>
  {{end}}
</nav>

<div class="layout">
  <nav class="toc" id="toc" aria-label="Table of contents"></nav>
  <main class="content">
    {{if .FrontMatter}}
    <details class="frontmatter">
      <summary>Front matter</summary>
      <pre>{{.FrontMatter}}</pre>
    </details>
    {{end}}
    <article class="markdown-body" id="doc">{{.Body}}</article>
    <footer class="pagefoot">
      <span>md.localhost {{.Version}}</span>
      {{if .ParentURL}}<a href="{{.ParentURL}}">Browse folder</a>{{end}}
    </footer>
  </main>
</div>

<script src="/assets/hljs.min.js?v={{.Version}}"></script>
<script src="/assets/jira.js?v={{.Version}}"></script>
<script src="/assets/app.js?v={{.Version}}"></script>
</body>
</html>
